<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document Scanner</title>
</head>
<body>

<h1>Document Scanner</h1>
<p>Greetings</p>


<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <input type="file" name="uploaded_file" accept="image/*">
    <button type="submit">Upload</button>
</form>

{% if originalImage %}
<h2>Original</h2>
<img src="data:image/png;base64,{{ originalImage }}" style="max-width: 500px;">
{% endif %}

{% if edgedImage %}
<h2>Edged</h2>
<img src="data:image/png;base64,{{ edgedImage }}" style="max-width: 500px;">
{% endif %}

{% if contouredImage %}
<h2>Contours</h2>
<img src="data:image/png;base64,{{ contouredImage }}" style="max-width: 500px;">
{% endif %}

{% if warpedImage %}
<h2>Warped</h2>

<p>Click the image to download it:</p>

<a href="data:image/png;base64,{{ warpedImage }}" download="scanned_document.png">
    <img src="data:image/png;base64,{{ warpedImage }}"
         alt="Warped document"
         style="max-width: 500px;">
</a>
{% endif %}

</body>
</html>
